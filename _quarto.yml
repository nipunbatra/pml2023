project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "assignments/*.qmd"
    - "notebooks/index.qmd"
    - "notebooks/*.ipynb"
  resources:
    - "lectures/**"

website:
  title: "ES 661 · Probabilistic Machine Learning"
  favicon: favicon.svg
  description: "Probabilistic Machine Learning at IIT Gandhinagar, Semester I 2023–24"
  site-url: https://nipunbatra.github.io/pml2023/
  search: false

format:
  html:
    theme: [cosmo, styles.scss, course.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    body-classes: dl
    link-external-newwindow: true
    include-in-header: course-theme.html
    include-before-body: rail.html
    include-after-body: course-tools.html

execute:
  freeze: auto
